[project]
name = "atlas-vector"
version = "0.1.0"
description = "Educational and reproducible HNSW ANN search engine and benchmark lab."
requires-python = ">=3.11"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "C4", "UP"]
ignore = ["E501", "B008", "C408"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
